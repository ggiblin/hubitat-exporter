apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
	labels:
		release: prometheus
	name: hubitat-exporter
	namespace: monitoring
spec:
	endpoints:
	- interval: 15s
		path: /metrics
		port: metrics
	namespaceSelector:
		matchNames:
		- hubitat-exporter
	selector:
		matchLabels:
			app: hubitat-exporter
